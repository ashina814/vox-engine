[project]
name = "vox"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "librosa>=0.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pandas>=2.1",
    "pyarrow>=15",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "gradio>=4.20",
    "wandb>=0.16",
    "tqdm",
    "rich",
    "torchcrepe>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "black", "mypy"]
notebook = ["jupyter", "matplotlib", "seaborn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
